[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notetaker"
version = "0.1.0"
description = "Préparation locale des procès-verbaux municipaux — validation technique"
requires-python = ">=3.11,<3.12"
dependencies = [
  "jsonschema==4.25.1", "python-docx==1.2.0", "reportlab==4.4.4",
  "psutil==7.1.0", "setuptools==80.9.0", "backports.tarfile==1.2.0",
]

[project.optional-dependencies]
asr = ["faster-whisper==1.2.1", "ctranslate2==4.6.0", "av==16.0.1", "numpy==2.2.6", "huggingface-hub==0.36.0", "tokenizers==0.22.1"]
audio = ["sounddevice==0.5.3"]
gui = ["PySide6==6.8.3"]
build = ["pyinstaller==6.16.0", "pyinstaller-hooks-contrib==2026.8"]
diarization = ["sherpa-onnx==1.13.8", "numpy==2.2.6"]
test = ["pytest==8.4.2", "pypdf==6.1.1"]

[project.scripts]
notetaker = "notetaker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
notetaker = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
